  /**************************************************************************
   * 3. UTILITAIRES DATE, VMA, GPX (HAVERSINE) & CTL/ATL/TSB
   **************************************************************************/
  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    date.setDate(diff);
    date.setHours(0, 0, 0, 0);
    return date;
  }
  function formatDateISO(d) {
    const dt = new Date(d);
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, '0');
    const day = String(dt.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function addDays(isoStr, days) {
    const dt = new Date(isoStr + 'T12:00:00');
    dt.setDate(dt.getDate() + days);
    return formatDateISO(dt);
  }
  function formatDateFR(isoStr) {
    const dt = new Date(isoStr + 'T12:00:00');
    return dt.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function formatTimeAgo(isoTimestamp) {
    if (!isoTimestamp) return 'À l\'instant';
    const diffMin = Math.max(0, Math.round((Date.now() - new Date(isoTimestamp).getTime()) / 60000));
    if (diffMin < 1) return 'À l\'instant';
    if (diffMin < 60) return `Il y a ${diffMin} min`;
    const diffH = Math.floor(diffMin / 60);
    if (diffH < 24) return `Il y a ${diffH}h`;
    return new Date(isoTimestamp).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  }
  function calcPaceFromVMA(vma, facteur) {
    if (!vma || !facteur || facteur <= 0) return 'OFF';
    const speedKmh = vma * facteur;
    const minPerKm = 60 / speedKmh;
    const mins = Math.floor(minPerKm);
    const secs = Math.round((minPerKm - mins) * 60);
    const sStr = secs === 60 ? '00' : String(secs).padStart(2, '0');
    const mStr = secs === 60 ? String(mins + 1).padStart(2, '0') : String(mins).padStart(2, '0');
    return `${mStr}:${sStr} min/km (${speedKmh.toFixed(1)} km/h)`;
  }
  function estimateDistanceKm(vma, facteur, dureeMin) {
    if (!vma || !facteur || !dureeMin) return 0;
    return +((vma * facteur) * (dureeMin / 60)).toFixed(2);
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function parseGPXText(xmlString) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlString, 'application/xml');
    const pts = Array.from(doc.getElementsByTagName('trkpt'));
    if (pts.length < 2) throw new Error('Le fichier GPX ne contient pas assez de points GPS (<trkpt>).');

    let totalDistKm = 0;
    let totalDPlus = 0;
    let firstTime = null;
    let lastTime = null;
    let prevLat = null, prevLon = null, prevEle = null;
    const elevations = [];

    pts.forEach((pt, idx) => {
      const lat = parseFloat(pt.getAttribute('lat'));
      const lon = parseFloat(pt.getAttribute('lon'));
      const eleNode = pt.getElementsByTagName('ele')[0];
      const timeNode = pt.getElementsByTagName('time')[0];
      const ele = eleNode ? parseFloat(eleNode.textContent) : null;
      const time = timeNode ? new Date(timeNode.textContent) : null;

      if (time && !isNaN(time.getTime())) {
        if (!firstTime) firstTime = time;
        lastTime = time;
      }
      if (prevLat !== null && !isNaN(lat) && !isNaN(lon)) {
        totalDistKm += haversineKm(prevLat, prevLon, lat, lon);
      }
      if (prevEle !== null && ele !== null && !isNaN(ele)) {
        const diff = ele - prevEle;
        if (diff > 0.8) totalDPlus += diff;
      }
      if (ele !== null && !isNaN(ele) && idx % Math.max(1, Math.floor(pts.length / 60)) === 0) {
        elevations.push({ km: +totalDistKm.toFixed(2), ele: Math.round(ele) });
      }
      prevLat = lat;
      prevLon = lon;
      if (ele !== null && !isNaN(ele)) prevEle = ele;
    });

    const durationMin = (firstTime && lastTime) ? Math.max(1, Math.round((lastTime - firstTime) / 60000)) : null;
    return {
      distanceKm: +totalDistKm.toFixed(2),
      dplusM: Math.round(totalDPlus),
      durationMin,
      pointsCount: pts.length,
      elevations
    };
  }

  function computeLoadCurve(athlete, targetDateISO, catalogCourse, catalogRenfo) {
    const days = 42;
    const startISO = addDays(targetDateISO, -(days - 1));
    let ctl = 28;
    let atl = 25;
    const series = [];

    for (let i = 0; i < days; i++) {
      const dateISO = addDays(startISO, i);
      const dayPlans = (athlete.plans || []).filter(p => p.date === dateISO);
      let dailyTSS = 0;

      dayPlans.forEach(p => {
        const c = catalogCourse.find(x => x.id === p.courseId);
        const r = catalogRenfo.find(x => x.id === p.renfoId);
        const durCourse = p.gpxData?.durationMin || (c ? c.duree : 0);
        const intensity = p.rpe ? (p.rpe / 10) : (c ? Math.max(0.55, c.facteurVMA) : 0.6);
        const dplusBonus = ((p.gpxData?.dplusM || (c ? c.dplus : 0)) / 100) * 4;
        if (durCourse > 0) {
          dailyTSS += (durCourse / 60) * (intensity ** 2) * 100 + dplusBonus;
        }
        if (r && r.duree > 0) {
          dailyTSS += (r.duree / 60) * 35;
        }
      });

      ctl = ctl + (dailyTSS - ctl) / 42;
      atl = atl + (dailyTSS - atl) / 7;
      const tsb = ctl - atl;
      series.push({
        date: dateISO,
        tss: Math.round(dailyTSS),
        ctl: +ctl.toFixed(1),
        atl: +atl.toFixed(1),
        tsb: +tsb.toFixed(1)
      });
    }
    return series;
  }

  // Bootloader OTA : si une mise à jour index.html a été déployée localement ou via Cloud, l'appliquer à chaud
  (function checkAndBootOtaUpdate() {
    try {
      if (window.__TRAILRUN_OTA_ACTIVE__) return;
      const otaRaw = localStorage.getItem(OTA_STORAGE_KEY);
      if (otaRaw) {
        const ota = JSON.parse(otaRaw);
        if (ota && ota.html && ota.html.includes('<html') && !ota.isCurrentBaseline) {
          window.__TRAILRUN_OTA_ACTIVE__ = true;
          const bridgeScript = `<script>window.__TRAILRUN_OTA_ACTIVE__ = true; window.__TRAILRUN_OTA_META__ = ${JSON.stringify({ version: ota.version, notes: ota.notes, deployedAt: ota.deployedAt })};<\/script>`;
          const patchedHtml = ota.html.includes('</head>')
            ? ota.html.replace('</head>', bridgeScript + '</head>')
            : bridgeScript + ota.html;
          document.open();
          document.write(patchedHtml);
          document.close();
        }
      }
    } catch (e) {
      console.warn('OTA Boot check:', e);
    }
  })();

  function isFirebaseConfigured() {
    return !!(state.firebaseConfig && state.firebaseConfig.databaseURL && state.firebaseConfig.apiKey);

  function initFirebase() {
    if (isFirebaseConfigured() && window.firebase) {
      try {
        if (firebase.apps.length > 0) {
          firebase.apps.forEach(app => app.delete());
        }
        const app = firebase.initializeApp(state.firebaseConfig);
        firebaseDbRef = firebase.database(app).ref('trailrun_state/global');
        firebaseDbRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val && val.payload) {
            try {
              const incoming = typeof val.payload === 'string' ? JSON.parse(val.payload) : val.payload;
              if (incoming && incoming.athletes) {
                const currentCfg = state.firebaseConfig;
                state = incoming;
                ensureDataIntegrity(state);
                if (!state.firebaseConfig || !state.firebaseConfig.databaseURL) {
                  state.firebaseConfig = currentCfg;
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                isApplyingRemoteUpdate = true;
                render();
                isApplyingRemoteUpdate = false;
                showToast('🔔 Mise à jour synchronisée en direct');
                if (incoming.lastPublishedRelease) {
                  setTimeout(() => checkForRemoteNetlifyUpdate(false), 4000);
                }
              }
            } catch (err) {
              console.error('Erreur parsing Firebase', err);
            }
          }
        });
      } catch (e) {
        console.error('Firebase init error', e);
      }
    }
  }

  async function saveState(silent = false) {

    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

          payload: JSON.stringify(state),
          updated_at: new Date().toISOString()
        });
        if (!silent) showToast('☁️ Synchronisé avec Firebase');
      } catch (e) {
        console.error('Firebase save error', e);
      }
    }
  }

  async function deployOtaHtmlUpdate(customHtml = null, customVersion = null, customNotes = null) {
    const rawHtml = (customHtml !== null ? customHtml : (document.getElementById('ota-code-textarea')?.value || '')).trim();
    const version = (customVersion !== null ? customVersion : (document.getElementById('ota-version-input')?.value || '')).trim() || 'v2.5.0';
    const notes = (customNotes !== null ? customNotes : (document.getElementById('ota-notes-input')?.value || '')).trim() || 'Mise à jour générale de l’interface et nouvelles fonctionnalités.';

    if (!rawHtml || rawHtml.length < 150 || (!rawHtml.includes('<html') && !rawHtml.includes('<body') && !rawHtml.includes('<script'))) {
      showToast('❌ Code HTML invalide ou incomplet. Collez un fichier index.html complet.');
      return;
    }

    // 1. Sauvegarde automatique des données métier + archivage de la version actuelle pour Rollback
    const history = getOtaHistory();
    history.unshift({
      id: 'ota_' + Date.now(),
      version: state.appVersion || 'v2.4.0',
      notes: 'Sauvegarde automatique avant mise à jour vers ' + version,
      deployedAt: new Date().toISOString(),
      html: getCurrentDocumentSource(),
      stateBackup: JSON.stringify(state)
    });
    saveOtaHistory(history);

    // 2. Diffusion de la notification système sur Coach & tous les Athlètes
    broadcastSystemUpdateNotifications(version, notes);
    await saveState(true);

    // 3. Enregistrement du nouveau index.html dans le stockage OTA
    const otaPayload = {
      version,
      notes,
      deployedAt: new Date().toISOString(),
      html: rawHtml,
      isCurrentBaseline: false
    };
    localStorage.setItem(OTA_STORAGE_KEY, JSON.stringify(otaPayload));

    showToast(`🚀 Déploiement de ${version} en cours...`);

    // 4. Injection et rechargement immédiat à chaud avec passerelle de liaison
    setTimeout(() => {
      window.__TRAILRUN_OTA_ACTIVE__ = true;
      const bridgeScript = `<script>
        window.__TRAILRUN_OTA_ACTIVE__ = true;
        window.__TRAILRUN_OTA_META__ = ${JSON.stringify({ version, notes, deployedAt: otaPayload.deployedAt })};
      <\/script>`;
      const patchedHtml = rawHtml.includes('</head>')
        ? rawHtml.replace('</head>', bridgeScript + '</head>')
        : bridgeScript + rawHtml;
      document.open();
      document.write(patchedHtml);
      document.close();
    }, 350);
  }

  function rollbackOtaVersion(historyId) {
    const history = getOtaHistory();
    const target = history.find(h => h.id === historyId);
    if (!target) return showToast('❌ Archive introuvable');

    if (target.stateBackup) {
      try {
        const restoredState = JSON.parse(target.stateBackup);
        if (restoredState && restoredState.athletes) {
          state = restoredState;
          ensureDataIntegrity(state);
        }
      } catch (e) {}
    }

    const rollbackVersion = target.version + ' (Restaurée)';
    const rollbackNotes = `Restauration de la version ${target.version} effectuée par le Coach.`;
    broadcastSystemUpdateNotifications(rollbackVersion, rollbackNotes);
    saveState(true);

    localStorage.setItem(OTA_STORAGE_KEY, JSON.stringify({
      version: rollbackVersion,
      notes: rollbackNotes,
      deployedAt: new Date().toISOString(),
      html: target.html,
      isCurrentBaseline: false
    }));

    showToast(`⏪ Restauration vers ${target.version}...`);
    setTimeout(() => {
      window.__TRAILRUN_OTA_ACTIVE__ = true;
      document.open();
      document.write(target.html);
      document.close();
    }, 300);
  }

  async function testGithubConnection() {
    const owner = (document.getElementById('gh-owner')?.value || state.githubDeployConfig?.owner || '').trim();
    const repo = (document.getElementById('gh-repo')?.value || state.githubDeployConfig?.repo || '').trim();
    const branch = (document.getElementById('gh-branch')?.value || state.githubDeployConfig?.branch || 'main').trim();
    const filePath = (document.getElementById('gh-filepath')?.value || state.githubDeployConfig?.filePath || 'index.html').trim();
    const token = (document.getElementById('gh-token')?.value || getGithubToken()).trim();

    if (!owner || !repo || !token) {
      showToast('❌ Renseignez Propriétaire, Dépôt et Token GitHub (PAT)');
      return;
    }

    const statusEl = document.getElementById('gh-api-status');
    if (statusEl) statusEl.innerHTML = `<span class="text-amber-400">⏳ Vérification de l'accès au dépôt ${owner}/${repo}...</span>`;

    try {
      const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${filePath.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(branch)}`;
      const res = await fetch(apiUrl, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28'
        }
      });

      if (res.status === 404) {
        if (statusEl) statusEl.innerHTML = `<span class="text-sky-400">ℹ️ Dépôt accessible, le fichier <code>${filePath}</code> sera créé lors de la première publication.</span>`;
        showToast('✅ Connexion GitHub OK (nouveau fichier prêt)');
        return;
      }

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `Erreur HTTP ${res.status}`);
      }

      const data = await res.json();
      if (statusEl) {
        statusEl.innerHTML = `<span class="text-emerald-400">✅ Connecté à <strong>${owner}/${repo}</strong> (${branch}) • SHA actif : <code>${(data.sha || '').slice(0, 7)}</code> (${Math.round((data.size || 0)/1024)} Ko)</span>`;
      }
      showToast('✅ Connexion API GitHub validée !');
    } catch (err) {
      if (statusEl) statusEl.innerHTML = `<span class="text-rose-400">❌ Échec connexion GitHub : ${err.message}</span>`;
      showToast('❌ ' + err.message);
    }
  }

  function encodeUtf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function injectVersionMetadataIntoHtml(rawHtml, version, notes) {
    const safeVersion = String(version || 'v2.5.0').replace(/"/g, '&quot;');
    const buildId = 'build_' + Date.now();
    let out = rawHtml;

    if (out.includes('name="trailrun-app-version"')) {
      out = out.replace(/<meta\s+name="trailrun-app-version"\s+content="[^"]*"\s*\/?>/i, `<meta name="trailrun-app-version" content="${safeVersion}" />`);
    } else if (out.includes('</head>')) {
      out = out.replace('</head>', `  <meta name="trailrun-app-version" content="${safeVersion}" />\n</head>`);
    }

    if (out.includes('name="trailrun-build-id"')) {
      out = out.replace(/<meta\s+name="trailrun-build-id"\s+content="[^"]*"\s*\/?>/i, `<meta name="trailrun-build-id" content="${buildId}" />`);
    } else if (out.includes('</head>')) {
      out = out.replace('</head>', `  <meta name="trailrun-build-id" content="${buildId}" />\n</head>`);
    }

    out = out.replace(/appVersion:\s*'v[0-9.]+'/, `appVersion: '${version.replace(/'/g, '')}'`);
    return { html: out, buildId };
  }

    try {

      const contentsUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodedPath}`;

        headers: {

      });
      if (getRes.ok) {
        const existingData = await getRes.json();
        existingSha = existingData.sha || null;
      } else if (getRes.status !== 404) {
        const errInfo = await getRes.json().catch(() => ({}));
        throw new Error(errInfo.message || `Erreur lecture GitHub (${getRes.status})`);
      }

      // 2. Injecter les métadonnées de version/build et encoder en Base64 UTF-8
      const { html: preparedHtml, buildId } = injectVersionMetadataIntoHtml(rawHtml, version, notes);
      const base64Content = encodeUtf8ToBase64(preparedHtml);

      if (statusEl) {
        statusEl.innerHTML = `<span class="text-amber-400">⏳ 2/3 Commit & Push de <code>${filePath}</code> (${version}) vers GitHub...</span>`;
      }

      const commitBody = {
        message: `🚀 Release ${version}: ${notes}`,
        content: base64Content,
        branch
      };
      if (existingSha) commitBody.sha = existingSha;

      const putRes = await fetch(contentsUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
          'X-GitHub-Api-Version': '2022-11-28'
        },
        body: JSON.stringify(commitBody)
      });

      if (!putRes.ok) {
        const putErr = await putRes.json().catch(() => ({}));
        throw new Error(putErr.message || `Erreur commit GitHub (${putRes.status})`);
      }

      const commitResult = await putRes.json();
      const newCommitSha = (commitResult.commit?.sha || '').slice(0, 7);

      // 3. Déclencher le Build Hook Netlify optionnel si renseigné
      let netlifyMsg = 'Déploiement continu Git → Netlify déclenché automatiquement.';
      if (netlifyHook) {
        if (statusEl) {
          statusEl.innerHTML = `<span class="text-amber-400">⏳ 3/3 Déclenchement du Build Hook Netlify...</span>`;
        }
        try {
          await fetch(netlifyHook, { method: 'POST', mode: 'no-cors' });
          netlifyMsg = 'Build Hook Netlify déclenché avec succès !';
        } catch (hookErr) {
          netlifyMsg = 'Push GitHub OK (Build Hook Netlify ignoré par CORS).';
        }
      }

      // 4. Mettre à jour l'état global & diffuser le signal de propagation sur tous les appareils connectés
      localStorage.setItem(LAST_REMOTE_BUILD_KEY, `${version}|${buildId}`);
      state.lastPublishedRelease = {
        version,
        notes,
        buildId,
        commitSha: newCommitSha,
        repo: `${owner}/${repo}`,
        branch,
        publishedAt: new Date().toISOString()
      };

      broadcastSystemUpdateNotifications(version, `${notes} (Commit GitHub #${newCommitSha} • Propagation Netlify active)`);
      await saveState(true);

      if (statusEl) {
        statusEl.innerHTML = `<span class="text-emerald-400">✅ Publié sur GitHub (commit <code>#${newCommitSha}</code>) • ${netlifyMsg}</span>`;
      }

      render();
      showToast(`🚀 ${version} publié sur GitHub & propagé vers Netlify !`);
    } catch (err) {
      if (statusEl) {
        statusEl.innerHTML = `<span class="text-rose-400">❌ Échec publication GitHub : ${err.message}</span>`;
      }
      showToast('❌ ' + err.message);
    }
  }

  // Surveillance automatique sur tous les appareils (Coach & Athlètes) de la version hébergée sur Netlify / Git
  async function checkForRemoteNetlifyUpdate(manualTrigger = false) {
    try {
      const baseUrl = (state.githubDeployConfig?.netlifySiteUrl || window.location.origin + window.location.pathname).split('#')[0].split('?')[0];
      if (!baseUrl.startsWith('http')) {
        if (manualTrigger) showToast('ℹ️ Surveillance active dès que le site est hébergé sur Netlify (HTTPS).');
        return;
      }

      const fetchUrl = `${baseUrl}?_ota_chk=${Date.now()}`;
      const res = await fetch(fetchUrl, { cache: 'no-store' });
      if (!res.ok) return;
      const remoteHtml = await res.text();

      const verMatch = remoteHtml.match(/<meta\s+name="trailrun-app-version"\s+content="([^"]+)"/i);
      const buildMatch = remoteHtml.match(/<meta\s+name="trailrun-build-id"\s+content="([^"]+)"/i);
      const remoteVer = verMatch ? verMatch[1] : null;
      const remoteBuild = buildMatch ? buildMatch[1] : null;

      const localVer = document.querySelector('meta[name="trailrun-app-version"]')?.getAttribute('content') || state.appVersion || 'v2.5.0';
      const localBuild = document.querySelector('meta[name="trailrun-build-id"]')?.getAttribute('content') || '';

      const remoteSig = `${remoteVer || ''}|${remoteBuild || ''}`;
      const localSig = `${localVer}|${localBuild}`;
      const lastAppliedSig = localStorage.getItem(LAST_REMOTE_BUILD_KEY) || localSig;

      if (remoteVer && (remoteVer !== localVer || (remoteBuild && remoteBuild !== localBuild)) && remoteSig !== lastAppliedSig) {
        localStorage.setItem(LAST_REMOTE_BUILD_KEY, remoteSig);
        localStorage.removeItem(OTA_STORAGE_KEY);
        showToast(`🚀 Nouvelle version ${remoteVer} détectée sur Netlify ! Mise à jour de l'appareil...`);
        setTimeout(() => {
          window.location.replace(`${baseUrl}?v=${encodeURIComponent(remoteVer)}_${Date.now()}`);
        }, 1200);
      } else if (manualTrigger) {
        showToast(`✅ Votre appareil est déjà à jour (${localVer})`);
      }
    } catch (e) {
      if (manualTrigger) showToast('⚠️ Impossible de joindre le serveur Netlify pour le moment.');
    }
  }

  function startAutoUpdateWatcher() {
    if (netlifyPollTimer) {
      clearInterval(netlifyPollTimer);
      netlifyPollTimer = null;
    }
    const enabled = state.githubDeployConfig?.autoCheckEnabled !== false;
    const intervalSec = Math.max(15, state.githubDeployConfig?.checkIntervalSec || 45);
    if (enabled) {
      netlifyPollTimer = setInterval(() => {
        checkForRemoteNetlifyUpdate(false);
      }, intervalSec * 1000);
    }
  }

  async function pullFromFirebase() {
    if (!firebaseDbRef) return;
    try {
      const snapshot = await firebaseDbRef.once('value');
      const val = snapshot.val();
      if (val && val.payload) {
        const incoming = typeof val.payload === 'string' ? JSON.parse(val.payload) : val.payload;
        if (incoming && incoming.athletes) {
          const currentCfg = state.firebaseConfig;
          state = incoming;
          ensureDataIntegrity(state);
          if (!state.firebaseConfig || !state.firebaseConfig.databaseURL) {
            state.firebaseConfig = currentCfg;
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          render();
        }
      }
    } catch (e) { /* base vide au premier lancement */ }
  }

  function checkMagicLink() {
    const hash = window.location.hash;
    if (hash && hash.startsWith('#magic=')) {
      try {
        const encoded = hash.slice(7);
        const jsonStr = decodeURIComponent(escape(atob(encoded)));
        const payload = JSON.parse(jsonStr);
        if (payload && payload.athlete) {
          if (payload.catalogCourse) state.catalogCourse = payload.catalogCourse;
          if (payload.catalogRenfo) state.catalogRenfo = payload.catalogRenfo;
          if (payload.catalogTemps) state.catalogTemps = payload.catalogTemps;
          ensureDataIntegrity(state);
          const idx = state.athletes.findIndex(a => a.id === payload.athlete.id);
          if (idx >= 0) state.athletes[idx] = payload.athlete;
          else state.athletes.push(payload.athlete);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          enterAthleteSpace(payload.athlete.id);
          showToast(`✨ Planning de ${payload.athlete.name} chargé via Lien Magique !`);
        }
      } catch (e) {
        console.error('Lien magique invalide', e);
      }
    }
  }

  function generateMagicLink(athleteId) {
    const athlete = state.athletes.find(a => a.id === athleteId);
    if (!athlete) return '';
    const usedCourseIds = new Set(athlete.plans.map(p => p.courseId));
    const usedRenfoIds = new Set(athlete.plans.map(p => p.renfoId));
    const payload = {
      athlete,
      catalogCourse: state.catalogCourse.filter(c => usedCourseIds.has(c.id)),
      catalogRenfo: state.catalogRenfo.filter(r => usedRenfoIds.has(r.id)),
      catalogTemps: state.catalogTemps
    };
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    const baseUrl = window.location.href.split('#')[0];
    return `${baseUrl}#magic=${b64}`;
  }

  /**************************************************************************
   * 5. LECTEUR INTERACTIF RENFORCEMENT MUSCULAIRE (WEB AUDIO + SVG + CHRONO)
   **************************************************************************/
  let renfoTimer = null;
  let renfoState = null;

  function playBeep(freq = 880, duration = 0.18, type = 'sine') {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }

  function stopRenfoAudioTimer() {
    if (renfoTimer) {
      clearInterval(renfoTimer);
      renfoTimer = null;
    }
  }

  function buildRenfoStepsQueue(renfo, selectedWeek = 2) {
    const wkCfg = renfo.weeklyProgression
      ? (renfo.weeklyProgression.find(w => w.week === selectedWeek) || renfo.weeklyProgression[1])
      : null;

    const rawExercises = renfo.exercices.map(ex => {
      if (ex.isCircuit && !ex.fixedTimer && wkCfg) {
        return { ...ex, workSec: wkCfg.workSec, restSec: wkCfg.restSec };
      }
      return { ...ex };
    });

    const steps = [];
    const rounds = renfo.circuitRounds || 1;

    if (rounds > 1 && rawExercises.some(e => e.isCircuit)) {
      const warmupEx = rawExercises.filter(e => !e.isCircuit && e.phaseTag && e.phaseTag.startsWith('1.'));
      const circuitEx = rawExercises.filter(e => e.isCircuit);
      const cooldownEx = rawExercises.filter(e => !e.isCircuit && (!e.phaseTag || !e.phaseTag.startsWith('1.')));

      warmupEx.forEach(ex => {
        steps.push({ ...ex, roundInfo: null, setNum: 1, totalSets: 1 });
      });

      for (let r = 1; r <= rounds; r++) {
        circuitEx.forEach((ex, cIdx) => {
          const isLastOfCircuit = (r === rounds && cIdx === circuitEx.length - 1);
          steps.push({
            ...ex,
            roundInfo: `Tour ${r}/${rounds}`,
            setNum: r,
            totalSets: rounds,
            restSec: isLastOfCircuit ? 10 : ex.restSec
          });
        });
      }

      cooldownEx.forEach(ex => {
        steps.push({ ...ex, roundInfo: null, setNum: 1, totalSets: 1 });
      });
    } else {
      rawExercises.forEach(ex => {
        const totalSets = ex.sets || 1;
        for (let s = 1; s <= totalSets; s++) {
          steps.push({
            ...ex,
            roundInfo: null,
            setNum: s,
            totalSets
          });
        }
      });
    }

    return steps;
  }

  function openRenfoPlayer(renfoId, weekNum = 2, readOnlyBadge = false) {
    const renfo = state.catalogRenfo.find(r => r.id === renfoId);
    if (!renfo || !renfo.exercices || renfo.exercices.length === 0) {
      showToast('Cette séance ne contient pas d\'exercices chronométrés.');
      return;
    }
    const stepsQueue = buildRenfoStepsQueue(renfo, weekNum);
    renfoState = {
      renfo,
      selectedWeek: weekNum,
      readOnlyBadge: readOnlyBadge || ui.view === 'athlete',
      stepsQueue,
      stepIdx: 0,
      phase: 'work',
      remaining: stepsQueue[0].workSec,
      running: false
    };
    renderRenfoPlayerModal();
  }

  function selectRenfoWeek(weekNum) {
    if (!renfoState) return;
    stopRenfoAudioTimer();
    openRenfoPlayer(renfoState.renfo.id, weekNum, renfoState.readOnlyBadge);
  }

  function toggleRenfoPlay() {
    if (!renfoState) return;
    if (renfoState.running) {
      renfoState.running = false;
      stopRenfoAudioTimer();
      renderRenfoPlayerModal();
      return;
    }
    renfoState.running = true;
    playBeep(660, 0.15);
    renfoTimer = setInterval(() => {
      if (!renfoState || !renfoState.running) return;
      renfoState.remaining--;
      if (renfoState.remaining <= 3 && renfoState.remaining > 0) {
        playBeep(520, 0.1);
      }
      if (renfoState.remaining <= 0) {
        const queue = renfoState.stepsQueue;
        const currentStep = queue[renfoState.stepIdx];

        if (renfoState.phase === 'work') {
          if (renfoState.stepIdx < queue.length - 1) {
            const restDuration = currentStep.restSec || 0;
            renfoState.stepIdx++;
            const nextStep = queue[renfoState.stepIdx];
            if (restDuration > 0) {
              renfoState.phase = 'rest';
              renfoState.remaining = restDuration;
              playBeep(440, 0.35, 'triangle');
            } else {
              renfoState.phase = 'work';
              renfoState.remaining = nextStep.workSec;
              playBeep(880, 0.25);
            }
          } else {
            renfoState.phase = 'done';
            renfoState.running = false;
            stopRenfoAudioTimer();
            playBeep(880, 0.5);
          }
        } else if (renfoState.phase === 'rest') {
          const nextStep = queue[renfoState.stepIdx];
          renfoState.phase = 'work';
          renfoState.remaining = nextStep.workSec;
          playBeep(880, 0.25);
        }
      }
      renderRenfoPlayerModal();
    }, 1000);
    renderRenfoPlayerModal();
  }

  function resetRenfoStep() {
    if (!renfoState) return;
    stopRenfoAudioTimer();
    renfoState.running = false;
    renfoState.stepIdx = 0;
    renfoState.phase = 'work';
    renfoState.remaining = renfoState.stepsQueue[0].workSec;
    renderRenfoPlayerModal();
  }

  function skipRenfoStep() {
    if (!renfoState) return;
    renfoState.remaining = 1;
  }

  function renderRenfoPlayerModal() {
    if (!renfoState) return;
    const { renfo, selectedWeek, readOnlyBadge, stepsQueue, stepIdx, phase, remaining, running } = renfoState;
    const step = stepsQueue[stepIdx];
    const pct = Math.min(100, Math.round((stepIdx / stepsQueue.length) * 100));

    if (phase === 'done') {
      openModal(`
        <div class="text-center py-8 space-y-4">
          <div class="text-6xl">🏆</div>
          <h3 class="text-2xl font-extrabold">Séance Renfo Terminée !</h3>
          <p class="text-slate-500 dark:text-slate-400">Bravo, vous avez complété <strong>${renfo.nom}</strong>.</p>
          <button onclick="closeModal()" class="px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold">Fermer le lecteur</button>
        </div>
      `);
      return;
    }

    const isWork = phase === 'work';
    const maxSec = isWork ? step.workSec : (step.restSec || 1);
    const ringPct = Math.max(0, Math.min(100, (remaining / maxSec) * 100));
    const currentWeekObj = renfo.weeklyProgression ? renfo.weeklyProgression.find(w => w.week === selectedWeek) : null;

    openModal(`

        <div class="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
          <div class="bg-emerald-500 h-full transition-all duration-300" style="width:${pct}%"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center bg-slate-50 dark:bg-slate-950 p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
          <div class="flex flex-col items-center justify-center">
            ${getPostureSVG(step.posture)}
            <span class="mt-2 text-xs text-slate-400">${isWork ? 'Illustration posture cible' : 'Préparez la posture suivante'}</span>
          </div>
          <div class="text-center md:text-left space-y-2">
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-1.5">
              <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold uppercase ${isWork ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">
                ${isWork ? '🔥 TRAVAIL' : '😮‍💨 RÉCUPÉRATION'}
              </span>
              ${step.roundInfo ? `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-sky-500/20 text-sky-400 font-bold">${step.roundInfo}</span>` : ''}
              ${step.phaseTag ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-400 font-semibold">${step.phaseTag}</span>` : ''}

            <div class="text-5xl font-black tracking-tight tabular-nums ${isWork ? 'text-emerald-500' : 'text-amber-400'}">
              ${String(Math.floor(remaining / 60)).padStart(2, '0')}:${String(remaining % 60).padStart(2, '0')}
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden">
              <div class="${isWork ? 'bg-emerald-500' : 'bg-amber-400'} h-full transition-all duration-500" style="width:${ringPct}%"></div>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 pt-1 leading-relaxed">${step.consignes}</p>
          </div>
        </div>

        ${renfo.safetyRules ? `

            <div class="font-extrabold text-amber-400">🛡️ Règles d'or de sécurité genou :</div>

            🔔
          </button>
        </div>
      </div>
    `);
  }

  function promptCoachPin() {
    if (ui.coachUnlocked) {

    openModal(`

          onkeydown="if(event.key==='Enter') verifyCoachPin()"

  function verifyCoachPin() {
    const val = document.getElementById('pin-input')?.value || '';

            return `

                      <button onclick="openVmaModal('${ath.id}')" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-emerald-400" title="Modifier / Tester la VMA">⚡ VMA</button>
                      <button onclick="openAthleteModal('${ath.id}')" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs" title="Modifier profil">✏️</button>
                      ${state.athletes.length > 1 ? `<button onclick="deleteAthlete('${ath.id}')" class="p-1.5 rounded-lg bg-slate-800 hover:bg-rose-900/50 text-xs text-rose-400" title="Supprimer">🗑️</button>` : ''}
                    </div>
                  </div>

                  <div class="mt-4 space-y-1.5">
                    <div class="flex justify-between text-xs font-semibold">
                      <span class="text-slate-400">Complétion semaine</span>
                      <span>${doneCount}/${totalCount} séances (${pct}%)</span>
                    </div>
                    <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                      <div class="${barColor} h-full transition-all" style="width:${pct}%"></div>
                    </div>
                  </div>

                  <div class="mt-4 space-y-2">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Dernières réactions & retours athlète</div>
                    ${recentFeedback.length === 0 ? `<p class="text-xs text-slate-500 italic">Aucune séance validée récemment.</p>` : recentFeedback.map(p => {
                      const c = state.catalogCourse.find(x => x.id === p.courseId);
                      return `
                        <div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-1.5">
                          <div class="flex items-center justify-between font-bold gap-1">
                            <span class="truncate">${p.reaction ? p.reaction + ' ' : ''}${c ? c.nom : 'Séance'}</span>
                            <span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 shrink-0">RPE ${p.rpe || '-'}/10</span>
                          </div>
                          ${p.athleteNote ? `<p class="text-slate-400 italic">"${p.athleteNote}"</p>` : ''}
                          <div class="flex items-center justify-between pt-1">
                            <button onclick="toggleCoachLike('${ath.id}', '${p.id}')" class="px-2.5 py-1 rounded-lg font-bold transition ${p.coachLiked ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                              👍 ${p.coachLiked ? 'Validé' : 'Encourager'}
                            </button>
                            <button onclick="openCoachCommentModal('${ath.id}', '${p.id}')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold">
                              💬 ${p.coachComment ? 'Modifier mot' : 'Laisser un mot'}
                            </button>
                          </div>
                          ${p.coachComment ? `<div class="text-[11px] text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded">Coach : ${p.coachComment}</div>` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>

                <div class="pt-2 border-t border-slate-800 flex items-center gap-2">
                  <button onclick="ui.selectedAthleteId='${ath.id}'; ui.coachTab='planner'; render()" class="flex-1 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs">📅 Planifier</button>
                  <button onclick="copyMagicLink('${ath.id}')" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold" title="Copier le Lien Magique">🔗 Lien Magique</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function renderCoachPlanner(ath) {
    if (!ath) return '<p>Créez un athlète pour commencer.</p>';
    const monday = formatDateISO(getMonday(ui.currentDate));
    const weekDates = Array.from({ length: 7 }, (_, i) => addDays(monday, i));

    const weekPlans = ath.plans.filter(p => weekDates.includes(p.date));
    let totalMin = 0, totalDplus = 0, totalRenfo = 0, totalKm = 0;
    weekPlans.forEach(p => {
      const c = state.catalogCourse.find(x => x.id === p.courseId);
      const r = state.catalogRenfo.find(x => x.id === p.renfoId);
      const t1 = state.catalogTemps.find(x => x.id === p.echauffementId);
      const t2 = state.catalogTemps.find(x => x.id === p.recupId);
      const dur = (c?.duree || 0) + (t1?.duree || 0) + (t2?.duree || 0);
      totalMin += dur;
      totalDplus += (c?.dplus || 0);
      if (r && r.id !== 'r0') totalRenfo++;
      if (c && c.facteurVMA > 0) totalKm += estimateDistanceKm(ath.vma, c.facteurVMA, c.duree);
    });

    return `
      <div class="space-y-5">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <img src="${ath.avatar}" class="w-11 h-11 rounded-full object-cover border-2 border-emerald-500" />
            <div>
              <div class="flex items-center gap-2">
                <h2 class="font-extrabold text-lg">${ath.name}</h2>
                <button onclick="openVmaModal('${ath.id}')" class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-bold">VMA ${ath.vma} km/h ⚡</button>
              </div>
              <p class="text-xs text-slate-400">Objectif : ${ath.targetRace?.name || 'Non défini'} (${ath.targetRace?.date || '-'})</p>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <div class="bg-slate-950 p-1 rounded-xl border border-slate-800 flex text-xs font-bold">
              <button onclick="ui.plannerMode='week'; render()" class="px-3 py-1.5 rounded-lg ${ui.plannerMode==='week' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}">Semaine</button>
              <button onclick="ui.plannerMode='month'; render()" class="px-3 py-1.5 rounded-lg ${ui.plannerMode==='month' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}">Mois</button>
              <button onclick="ui.plannerMode='year'; render()" class="px-3 py-1.5 rounded-lg ${ui.plannerMode==='year' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}">Année</button>
            </div>

            <button onclick="adaptWeekCycleFatigue('${ath.id}', '${monday}')" class="px-3.5 py-2 rounded-xl bg-pink-500/20 hover:bg-pink-500/30 border border-pink-500/40 text-pink-300 text-xs font-bold transition">
              🌸 Adapter la semaine (Cycle / Fatigue)
            </button>

            <button onclick="copyMagicLink('${ath.id}')" class="px-3.5 py-2 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 border border-sky-500/40 text-sky-300 text-xs font-bold">
              🔗 Lien Magique Athlète
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
            <div class="text-xs text-slate-400">Durée Course + Blocs</div>
            <div class="text-xl font-black text-emerald-400 mt-0.5">${Math.floor(totalMin/60)}h${String(totalMin%60).padStart(2,'0')}</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
            <div class="text-xs text-slate-400">Volume Estimé</div>
            <div class="text-xl font-black text-white mt-0.5">${totalKm.toFixed(1)} km</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
            <div class="text-xs text-slate-400">Dénivelé Positif (D+)</div>
            <div class="text-xl font-black text-amber-400 mt-0.5">${totalDplus} m</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
            <div class="text-xs text-slate-400">Séances Renfo</div>
            <div class="text-xl font-black text-sky-400 mt-0.5">${totalRenfo} séance(s)</div>
          </div>
        </div>

        ${ui.plannerMode === 'week' ? renderWeekGrid(ath, weekDates, monday) : ''}
        ${ui.plannerMode === 'month' ? renderMonthGrid(ath, 'coach') : ''}
        ${ui.plannerMode === 'year' ? renderYearGrid(ath, 'coach') : ''}
      </div>
    `;
  }

  function renderWeekGrid(ath, weekDates, monday) {
    return `
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <button onclick="ui.currentDate=addDays('${monday}', -7); render()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold">← Semaine préc.</button>
          <span class="font-extrabold text-sm sm:text-base">Semaine du ${formatDateFR(weekDates[0])} au ${formatDateFR(weekDates[6])}</span>
          <button onclick="ui.currentDate=addDays('${monday}', 7); render()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold">Semaine suiv. →</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-7 gap-3">
          ${weekDates.map(dateISO => {
            const plans = ath.plans.filter(p => p.date === dateISO);
            return `
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between min-h-[240px]">
                <div class="space-y-2.5">
                  <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <span class="text-xs font-extrabold uppercase text-slate-300">${formatDateFR(dateISO)}</span>
                    <button onclick="openPlanSessionModal('${ath.id}', '${dateISO}')" class="w-6 h-6 rounded-lg bg-emerald-500 text-slate-950 font-black text-sm flex items-center justify-center hover:bg-emerald-400" title="Ajouter une séance">+</button>
                  </div>

                  ${plans.length === 0 ? `<div class="text-xs text-slate-600 text-center py-8">Repos / Libre</div>` : plans.map(p => {
                    const c = state.catalogCourse.find(x => x.id === p.courseId);
                    const r = state.catalogRenfo.find(x => x.id === p.renfoId);
                    const t1 = state.catalogTemps.find(x => x.id === p.echauffementId);
                    const t2 = state.catalogTemps.find(x => x.id === p.recupId);
                    return `
                      <div class="p-2.5 rounded-xl bg-slate-950 border ${p.completed ? 'border-emerald-500/60' : 'border-slate-800'} space-y-1.5 text-xs">
                        <div class="flex items-start justify-between gap-1">
                          <span class="font-bold text-emerald-400 leading-snug">${c ? c.nom : 'Course'}</span>
                          <div class="flex gap-1 shrink-0">
                            <button onclick="openPlanSessionModal('${ath.id}', '${dateISO}', '${p.id}')" class="text-slate-400 hover:text-white">✏️</button>
                            <button onclick="deletePlannedSession('${ath.id}', '${p.id}')" class="text-rose-400 hover:text-rose-300">✕</button>
                          </div>
                        </div>
                        ${c && c.facteurVMA > 0 ? `<div class="text-[11px] text-slate-400">⚡ ${calcPaceFromVMA(ath.vma, c.facteurVMA)}</div>` : ''}
                        ${t1 && t1.duree > 0 ? `<div class="text-[11px] text-amber-300">🔥 Échauff. : ${t1.nom}</div>` : ''}
                        ${t2 && t2.duree > 0 ? `<div class="text-[11px] text-amber-300">🧘 Récup : ${t2.nom}</div>` : ''}
                        ${r && r.id !== 'r0' ? `<div class="text-[11px] text-sky-400 font-semibold">💪 ${r.nom}</div>` : ''}
                        ${(p.completed || p.reaction) ? `<div class="pt-1 text-[10px] font-bold text-emerald-400">${p.reaction || '✅'} Fait (RPE ${p.rpe || '-'}/10)</div>` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function renderMonthGrid(ath, role = 'coach') {
    const dt = new Date(ui.currentDate + 'T12:00:00');
    const year = dt.getFullYear();
    const month = dt.getMonth();
    const firstDay = new Date(year, month, 1);
    const startCal = getMonday(firstDay);
    const cells = Array.from({ length: 35 }, (_, i) => addDays(formatDateISO(startCal), i));
    const isCoach = role === 'coach';

    return `
      <div class="space-y-3">
        <div class="flex items-center justify-between bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
          <button onclick="ui.currentDate=formatDateISO(new Date(${year}, ${month - 1}, 1)); render()" class="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">← Mois préc.</button>
          <span class="font-extrabold capitalize text-sm sm:text-base">${firstDay.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</span>
          <button onclick="ui.currentDate=formatDateISO(new Date(${year}, ${month + 1}, 1)); render()" class="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">Mois suiv. →</button>
        </div>
        <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
          ${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(j => `<div class="text-center text-xs font-bold text-slate-400 py-1">${j}</div>`).join('')}
          ${cells.map(d => {
            const inMonth = new Date(d + 'T12:00:00').getMonth() === month;
            const dayPlans = ath.plans.filter(p => p.date === d);
            const onClickAction = isCoach
              ? `ui.currentDate='${d}'; ui.plannerMode='week'; render()`
              : `ui.currentDate='${d}'; ui.athletePlannerMode='week'; render()`;
            return `
              <div onclick="${onClickAction}" class="cursor-pointer min-h-[82px] sm:min-h-[96px] p-2 rounded-xl border transition ${inMonth ? 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-emerald-500/60' : 'bg-slate-100/50 dark:bg-slate-950/50 border-slate-200/40 dark:border-slate-900 opacity-45'}">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xs font-bold">${d.slice(8, 10)}</span>
                  ${dayPlans.some(x => x.renfoId && x.renfoId !== 'r0') ? `<span class="text-[10px]" title="Séance Renforcement">💪</span>` : ''}
                </div>
                ${dayPlans.map(p => {
                  const c = state.catalogCourse.find(x => x.id === p.courseId);
                  return `<div class="truncate text-[10px] px-1.5 py-0.5 rounded mb-0.5 font-semibold ${p.completed ? 'bg-emerald-500/20 text-emerald-500 dark:text-emerald-300' : 'bg-slate-200/80 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}">${c ? c.nom : 'Séance'}</div>`;
                }).join('')}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function renderYearGrid(ath, role = 'coach') {
    const year = new Date(ui.currentDate + 'T12:00:00').getFullYear();
    const isCoach = role === 'coach';

    return `
      <div class="space-y-4">
        <div class="flex items-center justify-between bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
          <button onclick="ui.currentDate='${year - 1}-01-01'; render()" class="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">← ${year - 1}</button>
          <span class="font-black text-base sm:text-lg">Calendrier Annuel ${year}</span>
          <button onclick="ui.currentDate='${year + 1}-01-01'; render()" class="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">${year + 1} →</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
          ${Array.from({ length: 12 }, (_, m) => {
            const prefix = `${year}-${String(m + 1).padStart(2, '0')}`;
            const mPlans = ath.plans.filter(p => p.date.startsWith(prefix) && (p.courseId !== 'c115' || (p.renfoId && p.renfoId !== 'r0')));
            const renfoCount = mPlans.filter(p => p.renfoId && p.renfoId !== 'r0').length;
            const mName = new Date(year, m, 1).toLocaleDateString('fr-FR', { month: 'long' });
            const onClickAction = isCoach
              ? `ui.currentDate='${prefix}-01'; ui.plannerMode='month'; render()`
              : `ui.currentDate='${prefix}-01'; ui.athletePlannerMode='month'; render()`;

            return `
              <div onclick="${onClickAction}" class="cursor-pointer bg-white dark:bg-slate-900 hover:border-emerald-500/60 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 transition shadow-sm space-y-2">
                <div class="flex items-center justify-between">
                  <div class="font-extrabold capitalize text-base">${mName}</div>
                  ${renfoCount > 0 ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-400 font-bold">💪 ${renfoCount} renfo</span>` : ''}
                </div>
                <div class="text-xs text-slate-500 dark:text-slate-400">${mPlans.length} séance(s) planifiée(s)</div>
                <div class="flex items-center justify-between text-xs pt-1 border-t border-slate-100 dark:border-slate-800">
                  <span class="text-emerald-500 dark:text-emerald-400 font-bold">${mPlans.filter(x => x.completed).length} réalisée(s)</span>
                  <span class="text-[11px] text-slate-400">Ouvrir le mois →</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function renderCoachTaper(ath) {
    if (!ath) return '';
    const targetDate = ath.targetRace?.date || addDays(formatDateISO(new Date()), 21);
    const series = computeLoadCurve(ath, targetDate, state.catalogCourse, state.catalogRenfo);
    const raceDay = series[series.length - 1];

    const W = 760, H = 260, pad = 36;
    const maxVal = Math.max(70, ...series.map(s => Math.max(s.ctl, s.atl)));
    const minVal = Math.min(-25, ...series.map(s => s.tsb));
    const range = maxVal - minVal || 1;
    const toX = i => pad + (i / (series.length - 1)) * (W - pad * 2);
    const toY = v => H - pad - ((v - minVal) / range) * (H - pad * 2);

    const ctlPath = series.map((s, i) => `${i === 0 ? 'M' : 'L'} ${toX(i).toFixed(1)} ${toY(s.ctl).toFixed(1)}`).join(' ');
    const atlPath = series.map((s, i) => `${i === 0 ? 'M' : 'L'} ${toX(i).toFixed(1)} ${toY(s.atl).toFixed(1)}`).join(' ');
    const tsbPath = series.map((s, i) => `${i === 0 ? 'M' : 'L'} ${toX(i).toFixed(1)} ${toY(s.tsb).toFixed(1)}`).join(' ');

    const freshnessStatus = raceDay.tsb >= 5 && raceDay.tsb <= 25
      ? { label: '🎯 Zone de Pic de Forme Idéale (+5 à +25)', color: 'text-emerald-400' }
      : raceDay.tsb < 0
      ? { label: '⚠️ Fatigue résiduelle élevée : réduire le volume les 10 derniers jours', color: 'text-amber-400' }
      : { label: 'ℹ️ Fraîcheur très haute : attention au désentraînement', color: 'text-sky-400' };

    return `
      <div class="space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4">
          <div>
            <h2 class="text-xl font-black">Aide au Pic de Forme & Affûtage (CTL / ATL / TSB)</h2>
            <p class="text-xs text-slate-400">Projection sur les 6 semaines précédant l'objectif : <strong>${ath.targetRace?.name || 'Course Objectif'}</strong></p>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-xs text-slate-400">Date Jour J :</label>
            <input type="date" value="${targetDate}" onchange="updateTargetRaceDate('${ath.id}', this.value)" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs font-bold" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <div class="text-xs text-sky-400 font-bold">CTL (Condition Physique 42j) au Jour J</div>
            <div class="text-3xl font-black mt-1">${raceDay.ctl}</div>
            <div class="text-xs text-slate-400 mt-1">Charge chronique accumulée</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <div class="text-xs text-rose-400 font-bold">ATL (Fatigue Aiguë 7j) au Jour J</div>
            <div class="text-3xl font-black mt-1">${raceDay.atl}</div>
            <div class="text-xs text-slate-400 mt-1">Charge récente des 7 derniers jours</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <div class="text-xs text-emerald-400 font-bold">TSB (Indice de Fraîcheur) au Jour J</div>
            <div class="text-3xl font-black mt-1 ${raceDay.tsb >= 0 ? 'text-emerald-400' : 'text-amber-400'}">${raceDay.tsb > 0 ? '+' : ''}${raceDay.tsb}</div>
            <div class="text-xs mt-1 ${freshnessStatus.color}">${freshnessStatus.label}</div>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2 text-xs font-bold">
            <div class="flex items-center gap-4">
              <span class="flex items-center gap-1.5 text-sky-400"><span class="w-3 h-1 bg-sky-400 inline-block"></span> CTL (Forme)</span>
              <span class="flex items-center gap-1.5 text-rose-400"><span class="w-3 h-1 bg-rose-400 inline-block"></span> ATL (Fatigue)</span>
              <span class="flex items-center gap-1.5 text-emerald-400"><span class="w-3 h-1 bg-emerald-400 inline-block"></span> TSB (Fraîcheur)</span>
            </div>
            <span id="taper-hover-info" class="text-slate-400">Survolez un point de la courbe pour voir le détail</span>
          </div>

          <div class="overflow-x-auto">
            <svg viewBox="0 0 ${W} ${H}" class="w-full min-w-[600px] h-64">
              <line x1="${pad}" y1="${toY(0)}" x2="${W - pad}" y2="${toY(0)}" stroke="#334155" stroke-dasharray="4 4" />
              <text x="${pad - 6}" y="${toY(0) + 4}" text-anchor="end" fill="#64748b" font-size="10">0</text>
              <path d="${ctlPath}" fill="none" stroke="#38bdf8" stroke-width="3" />
              <path d="${atlPath}" fill="none" stroke="#fb7185" stroke-width="2.5" />
              <path d="${tsbPath}" fill="none" stroke="#10b981" stroke-width="3" />
              ${series.map((s, i) => `
                <circle cx="${toX(i)}" cy="${toY(s.tsb)}" r="4.5" fill="#10b981" class="cursor-pointer hover:r-6"
                  onmouseover="document.getElementById('taper-hover-info').textContent='${formatDateFR(s.date)} → CTL: ${s.ctl} | ATL: ${s.atl} | Fraîcheur TSB: ${s.tsb > 0 ? '+' : ''}${s.tsb}'" />
              `).join('')}

                  <button onclick="setCoachAvatarUrl('${url}')" class="w-9 h-9 rounded-full overflow-hidden border-2 transition hover:scale-105 ${cp.avatar === url ? 'ring-2 ring-offset-2 ring-offset-slate-900' : 'border-transparent opacity-75 hover:opacity-100'}" style="${cp.avatar === url ? 'border-color: var(--accent-color)' : ''}" title="Choisir cet avatar">

                📷 Importer / URL
              </button>
            </div>
          </div>

          <div class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
