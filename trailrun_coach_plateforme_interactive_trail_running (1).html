            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
              <input id="coach-name-input" type="text" value="${cp.name}" placeholder="Ex: Coach Alex" class="flex-1 sm:w-56 bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs font-bold" />
              <button onclick="updateCoachName()" class="px-4 py-2 rounded-xl text-slate-950 font-bold text-xs shadow" style="background: var(--accent-color)">Enregistrer</button>
            </div>
          </div>

          <div class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1 max-w-md">
              <div class="font-extrabold text-sm flex items-center gap-2">🎨 Couleur principale de l'application</div>
              <p class="text-xs text-slate-500 dark:text-slate-400">Personnalise la couleur d'accentuation des boutons, onglets et badges de l'interface Coach.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2.5">
              ${palette.map(c => `
                <button onclick="setCoachAccentColor('${c.hex}')" title="${c.name}" class="w-8 h-8 rounded-full border-2 transition ${cp.accentColor === c.hex ? 'scale-110 border-white ring-2 ring-slate-400' : 'border-transparent hover:scale-105'}" style="background:${c.hex}"></button>
              `).join('')}
              <label class="cursor-pointer flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold" title="Couleur personnalisée">
                <span>🎯</span>
                <input type="color" value="${cp.accentColor || '#10b981'}" onchange="setCoachAccentColor(this.value)" class="w-5 h-5 bg-transparent border-0 cursor-pointer" />
              </label>
            </div>
          </div>

          <div class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1 max-w-md">
              <div class="font-extrabold text-sm flex items-center gap-2">🌓 Thème d'affichage Coach</div>
              <p class="text-xs text-slate-500 dark:text-slate-400">Basculez entre le mode sombre et le mode clair.</p>
            </div>
            <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-950 p-1 rounded-xl border border-slate-200 dark:border-slate-800">
              <button onclick="setCoachThemeMode('dark')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${cp.themeMode !== 'light' ? 'text-slate-950 shadow' : 'text-slate-500'}" style="${cp.themeMode !== 'light' ? 'background: var(--accent-color)' : ''}">🌙 Sombre</button>
              <button onclick="setCoachThemeMode('light')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${cp.themeMode === 'light' ? 'text-slate-950 shadow' : 'text-slate-500'}" style="${cp.themeMode === 'light' ? 'background: var(--accent-color)' : ''}">☀️ Clair</button>
            </div>
          </div>

          <div class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1 max-w-md">
              <div class="font-extrabold text-sm flex items-center gap-2">🔐 Code PIN de sécurité Coach</div>
              <p class="text-xs text-slate-500 dark:text-slate-400">Protège l'accès aux plannings globaux et catalogues d'entraînement.</p>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
              <input id="new-pin-input" type="text" value="${state.coachPin}" maxlength="8" class="w-32 bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs font-bold tracking-widest text-center" />
              <button onclick="updateCoachPin()" class="px-4 py-2 rounded-xl text-slate-950 font-bold text-xs shadow" style="background: var(--accent-color)">Mettre à jour</button>
            </div>
          </div>

          <div class="p-5 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div class="space-y-1">
                <div class="font-extrabold text-sm flex items-center gap-2">🔥 Synchronisation Cloud (Google Firebase)</div>
                <p class="text-xs text-slate-500 dark:text-slate-400">Paramètres de votre base Realtime Database pour synchroniser en temps réel avec vos athlètes.</p>
              </div>
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${isFirebaseConfigured() ? 'bg-emerald-500/15 text-emerald-400' : 'bg-amber-500/15 text-amber-400'}">
                <span class="w-2 h-2 rounded-full ${isFirebaseConfigured() ? 'bg-emerald-400' : 'bg-amber-400'}"></span>
                ${isFirebaseConfigured() ? 'Connecté' : 'Non configuré'}
              </span>
            </div>
            <div class="space-y-3 pt-1">
              <div>
                <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1">Database URL (obligatoire) *</label>
                <input id="fb-db-url" type="text" value="${cfg.databaseURL || ''}" placeholder="https://votre-projet-default-rtdb.europe-west1.firebasedatabase.app" class="w-full bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs" />
              </div>
              <div>
                <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1">API Key (obligatoire) *</label>
                <input id="fb-api-key" type="text" value="${cfg.apiKey || ''}" placeholder="AIzaSy..." class="w-full bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs" />
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1">Project ID</label>
                  <input id="fb-project-id" type="text" value="${cfg.projectId || ''}" placeholder="trailrun-coach" class="w-full bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs" />
                </div>
                <div>
                  <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1">Auth Domain</label>
                  <input id="fb-auth-domain" type="text" value="${cfg.authDomain || ''}" placeholder="trailrun-coach.firebaseapp.com" class="w-full bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs" />
                </div>
              </div>
              <button onclick="saveFirebaseConfig()" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs">🔥 Connecter Firebase & Synchroniser</button>
            </div>
          </div>

        </div>
      </div>
    `;
  }

  /**************************************************************************
   * 8. INTERFACE ATHLÈTE (NOTIFICATIONS EN DIRECT, CALENDRIER ANNUEL/MOIS/SEMAINE, RENFO LECTURE SEULE)
   **************************************************************************/
  function renderAthleteView() {
    const ath = state.athletes.find(a => a.id === ui.selectedAthleteId) || state.athletes[0];
    if (!ath) { ui.view = 'landing'; return renderLanding(); }
    applyTheme(ath);

    const athNotifCount = (ath.notifications || []).length;
    const monday = formatDateISO(getMonday(ui.currentDate));
    const weekDates = Array.from({ length: 7 }, (_, i) => addDays(monday, i));

    return `
      <div class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
        <!-- HEADER ATHLÈTE AVEC AVATAR COMPTEUR + ICÔNE NOTIFICATION À CÔTÉ -->
        <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3">
          <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <button onclick="ui.view='landing'; render()" class="px-2.5 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">← Profils</button>
              
              <div class="flex items-center gap-2">
                <button onclick="openAthleteAvatarModal('${ath.id}')" class="relative group" title="Changer ma photo">
                  <img src="${ath.avatar}" class="w-10 h-10 rounded-full object-cover border-2" style="border-color: var(--accent-color)" />
                  ${athNotifCount > 0 ? `<span class="badge-pulse absolute -top-1.5 -right-1.5 min-w-[20px] h-5 px-1 rounded-full bg-red-500 text-white text-[10px] font-black flex items-center justify-center shadow">${athNotifCount}</span>` : ''}
                </button>

                <button onclick="openNotificationsModal('athlete', '${ath.id}')" class="relative w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 flex items-center justify-center text-base transition" title="Notifications du Coach (${athNotifCount})">
                  🔔
                  ${athNotifCount > 0 ? `<span class="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-black flex items-center justify-center">${athNotifCount}</span>` : ''}
                </button>
              </div>

              <div>
                <h1 class="font-extrabold text-sm sm:text-base leading-tight">${ath.name}</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">VMA : <strong>${ath.vma} km/h</strong></p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <button onclick="enterAthleteSpace('${ath.id}')" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-semibold" title="Simuler la réouverture de mon espace">
                🔄 <span class="hidden sm:inline">Réouvrir</span>
              </button>
              <button onclick="toggleAthleteBigCards('${ath.id}')" class="px-2.5 py-1.5 rounded-xl text-xs font-bold border transition ${ath.bigCards ? 'text-white' : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700'}" style="${ath.bigCards ? 'background: var(--accent-color); border-color: var(--accent-color)' : ''}" title="Mode Grandes Cartes Terrain">
                🔍 <span class="hidden sm:inline">Grandes Cartes</span>
              </button>
              <button onclick="toggleAthleteTheme('${ath.id}')" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center text-base" title="Thème Clair / Sombre">
                ${ath.themeMode === 'dark' ? '☀️' : '🌙'}
              </button>
            </div>
          </div>

          <div class="max-w-5xl mx-auto flex items-center gap-2 overflow-x-auto pt-3 pb-0.5 scrollbar-thin">
            <button onclick="ui.athleteTab='planning'; render()" class="whitespace-nowrap px-4 py-1.5 rounded-xl text-xs font-bold transition ${ui.athleteTab==='planning' ? 'text-white shadow' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}" style="${ui.athleteTab==='planning' ? 'background: var(--accent-color)' : ''}">📅 Mon Planning</button>
            <button onclick="ui.athleteTab='renfo'; render()" class="whitespace-nowrap px-4 py-1.5 rounded-xl text-xs font-bold transition ${ui.athleteTab==='renfo' ? 'text-white shadow' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}" style="${ui.athleteTab==='renfo' ? 'background: var(--accent-color)' : ''}">💪 Séances Renfo (Lecteur)</button>
            <button onclick="ui.athleteTab='stats'; render()" class="whitespace-nowrap px-4 py-1.5 rounded-xl text-xs font-bold transition ${ui.athleteTab==='stats' ? 'text-white shadow' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}" style="${ui.athleteTab==='stats' ? 'background: var(--accent-color)' : ''}">📊 Records & Évolution</button>
            <button onclick="ui.athleteTab='settings'; render()" class="whitespace-nowrap px-4 py-1.5 rounded-xl text-xs font-bold transition ${ui.athleteTab==='settings' ? 'text-white shadow' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}" style="${ui.athleteTab==='settings' ? 'background: var(--accent-color)' : ''}">🎨 Personnalisation</button>
          </div>
        </header>

        <main class="max-w-5xl mx-auto w-full flex-1 p-4 sm:p-6">
          ${ui.athleteTab === 'planning' ? renderAthletePlanning(ath, weekDates, monday) : ''}
          ${ui.athleteTab === 'renfo' ? renderAthleteRenfoLibrary() : ''}
          ${ui.athleteTab === 'stats' ? renderAthleteStats(ath) : ''}
          ${ui.athleteTab === 'settings' ? renderAthleteSettings(ath) : ''}
        </main>
      </div>
    `;
  }

  function renderAthletePlanning(ath, weekDates, monday) {
    return `
      <div class="space-y-5">
        <!-- BARRE DE SÉLECTION DE VUE (SEMAINE / MOIS / ANNÉE) + AJOUT COURSE -->
        <div class="flex flex-wrap items-center justify-between gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
          <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-950 p-1 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-bold">
            <button onclick="ui.athletePlannerMode='week'; render()" class="px-3.5 py-1.5 rounded-lg transition ${ui.athletePlannerMode==='week' ? 'text-white shadow' : 'text-slate-500 dark:text-slate-400'}" style="${ui.athletePlannerMode==='week' ? 'background: var(--accent-color)' : ''}">Semaine</button>
            <button onclick="ui.athletePlannerMode='month'; render()" class="px-3.5 py-1.5 rounded-lg transition ${ui.athletePlannerMode==='month' ? 'text-white shadow' : 'text-slate-500 dark:text-slate-400'}" style="${ui.athletePlannerMode==='month' ? 'background: var(--accent-color)' : ''}">Mois</button>
            <button onclick="ui.athletePlannerMode='year'; render()" class="px-3.5 py-1.5 rounded-lg transition ${ui.athletePlannerMode==='year' ? 'text-white shadow' : 'text-slate-500 dark:text-slate-400'}" style="${ui.athletePlannerMode==='year' ? 'background: var(--accent-color)' : ''}">Année</button>
          </div>

          <button onclick="openAthleteAddRaceModal('${ath.id}')" class="px-3.5 py-2 rounded-xl text-white font-bold text-xs shadow" style="background: var(--accent-color)">
            🏁 + Ajouter une course sur mon planning
          </button>
        </div>

        ${ui.athletePlannerMode === 'week' ? renderAthleteWeekView(ath, weekDates, monday) : ''}
        ${ui.athletePlannerMode === 'month' ? renderMonthGrid(ath, 'athlete') : ''}
        ${ui.athletePlannerMode === 'year' ? renderYearGrid(ath, 'athlete') : ''}
      </div>
    `;
  }

  function renderAthleteWeekView(ath, weekDates, monday) {
    return `
      <div class="space-y-4">
        <div class="flex items-center justify-between bg-white dark:bg-slate-900 px-4 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-800">
          <button onclick="ui.currentDate=addDays('${monday}', -7); render()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">← Sem. préc.</button>
          <span class="font-extrabold text-sm">Semaine du ${formatDateFR(weekDates[0])} au ${formatDateFR(weekDates[6])}</span>
          <button onclick="ui.currentDate=addDays('${monday}', 7); render()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">Sem. suiv. →</button>
        </div>

        <div class="space-y-3">
          ${weekDates.map(dateISO => {
            const plans = ath.plans.filter(p => p.date === dateISO);
            return `
              <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                  <span class="font-extrabold uppercase text-xs tracking-wider text-slate-500 dark:text-slate-400">${formatDateFR(dateISO)}</span>
                  ${plans.length === 0 ? `<span class="text-xs text-slate-400">Repos</span>` : ''}
                </div>

                <div class="space-y-3">
                  ${plans.map(p => {
                    const c = state.catalogCourse.find(x => x.id === p.courseId);
                    const r = state.catalogRenfo.find(x => x.id === p.renfoId);
                    const t1 = state.catalogTemps.find(x => x.id === p.echauffementId);
                    const t2 = state.catalogTemps.find(x => x.id === p.recupId);

                    return `
                      <div class="session-card p-4 rounded-2xl bg-slate-50 dark:bg-slate-950 border ${p.completed ? 'border-emerald-500/60' : 'border-slate-200 dark:border-slate-800'} space-y-3">
                        <div class="flex flex-wrap items-start justify-between gap-2">
                          <div>
                            <div class="flex items-center gap-2">
                              <span class="session-title font-extrabold text-base" style="color: var(--accent-color)">${c ? c.nom : 'Séance'}</span>
                              <span class="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-500 font-semibold">🔒 Lecture seule</span>
                            </div>
                            <p class="session-desc text-xs text-slate-600 dark:text-slate-300 mt-1">${c ? c.description : ''}</p>
                          </div>

                          <div class="flex items-center gap-1.5">
                            <label class="text-[11px] text-slate-400">Déplacer :</label>
                            <input type="date" value="${p.date}" onchange="moveAthleteSessionDay('${ath.id}', '${p.id}', this.value)" class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1 text-xs font-semibold" />
                          </div>
                        </div>

                        <div class="flex flex-wrap gap-2 text-xs">
                          ${c && c.facteurVMA > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 font-semibold">⚡ Allure : ${calcPaceFromVMA(ath.vma, c.facteurVMA)}</span>` : ''}
                          ${c && c.dplus > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 font-semibold">⛰️ ${c.dplus} m D+</span>` : ''}
                          ${t1 && t1.duree > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-amber-500/15 text-amber-500 font-semibold">🔥 Échauffement : ${t1.nom}</span>` : ''}
                          ${t2 && t2.duree > 0 ? `<span class="px-2.5 py-1 rounded-lg bg-amber-500/15 text-amber-500 font-semibold">🧘 Récup : ${t2.nom}</span>` : ''}
                        </div>

                        ${r && r.id !== 'r0' ? `
                          <div class="p-3 rounded-xl bg-sky-500/10 border border-sky-500/30 flex flex-wrap items-center justify-between gap-2">
                            <div>
                              <div class="flex items-center gap-2">
                                <span class="font-bold text-xs text-sky-400">💪 Renforcement : ${r.nom}</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 font-semibold">🔒 Lecture seule</span>
                              </div>
                              <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${r.description}</div>
                            </div>
                            ${r.exercices?.length ? `
                              <button onclick="openRenfoPlayer('${r.id}', 2, true)" class="px-3.5 py-2 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-bold text-xs shadow">
                                ▶️ Lancer le lecteur Renfo
                              </button>
                            ` : ''}
                          </div>
                        ` : ''}

                        ${p.gpxData ? `
                          <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs flex flex-wrap items-center justify-between gap-2">
                            <span class="font-bold text-emerald-400">⌚ Trace GPS synchronisée : ${p.gpxData.distanceKm} km • ${p.gpxData.dplusM} m D+ ${p.gpxData.durationMin ? '• ' + p.gpxData.durationMin + ' min' : ''}</span>
                          </div>
                        ` : ''}

                        ${p.coachComment || p.coachLiked ? `
                          <div class="p-2.5 rounded-xl bg-emerald-500/15 text-xs text-emerald-400 font-semibold">
                            ${p.coachLiked ? '👍 Validé par le Coach ! ' : ''}${p.coachComment ? `« ${p.coachComment} »` : ''}
                          </div>
                        ` : ''}

                        <div class="pt-2 border-t border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
                          <div class="flex flex-wrap items-center gap-1.5">
                            <button onclick="openValidateRpeModal('${ath.id}', '${p.id}')" class="px-4 py-2 rounded-xl text-xs font-extrabold text-white transition" style="background: ${p.completed ? '#10b981' : 'var(--accent-color)'}">
                              ${p.completed ? `✅ ${p.reaction || ''} Séance validée (RPE ${p.rpe}/10)` : '✔️ Réagir & Valider la séance'}
                            </button>
                            ${['💪', '🔥', '😓', '🤕'].map(emo => `
                              <button onclick="quickAthleteReaction('${ath.id}', '${p.id}', '${emo}')" class="w-8 h-8 rounded-xl border text-sm flex items-center justify-center transition ${p.reaction === emo ? 'bg-emerald-500/20 border-emerald-500 scale-105' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-slate-400'}" title="Réaction rapide ${emo}">
                                ${emo}
                              </button>
                            `).join('')}
                          </div>

                          <label class="cursor-pointer px-3.5 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-xs font-bold flex items-center gap-1.5">
                            ⌚ Importer fichier montre (.gpx)
                            <input type="file" accept=".gpx,application/gpx+xml" class="hidden" onchange="handleGpxUpload(event, '${ath.id}', '${p.id}')" />
                          </label>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}

  function renderAthleteStats(ath) {
    const now = new Date();
    const monday = formatDateISO(getMonday(now));
    const sunday = addDays(monday, 6);
    const monthPrefix = formatDateISO(now).slice(0, 7);
    const yearPrefix = formatDateISO(now).slice(0, 4);

    let kmWeek = 0, kmMonth = 0, kmYear = 0, dplusYear = 0;
    ath.plans.filter(p => p.completed).forEach(p => {
      const c = state.catalogCourse.find(x => x.id === p.courseId);
      const km = p.gpxData?.distanceKm || (c ? estimateDistanceKm(ath.vma, c.facteurVMA, c.duree) : 0);
      const dp = p.gpxData?.dplusM || (c?.dplus || 0);
      if (p.date >= monday && p.date <= sunday) kmWeek += km;
      if (p.date.startsWith(monthPrefix)) kmMonth += km;
      if (p.date.startsWith(yearPrefix)) { kmYear += km; dplusYear += dp; }
    });

    const weeklyBars = Array.from({ length: 6 }, (_, idx) => {
      const wStart = addDays(monday, -(5 - idx) * 7);
      const wEnd = addDays(wStart, 6);
      const wKm = ath.plans.filter(p => p.completed && p.date >= wStart && p.date <= wEnd).reduce((sum, p) => {
        const c = state.catalogCourse.find(x => x.id === p.courseId);
        return sum + (p.gpxData?.distanceKm || (c ? estimateDistanceKm(ath.vma, c.facteurVMA, c.duree) : 0));
      }, 0);
      return { label: wStart.slice(5), km: +wKm.toFixed(1) };
    });
    const maxKm = Math.max(20, ...weeklyBars.map(b => b.km));

    return `
      <div class="space-y-6">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
            <div class="text-xs text-slate-400">Km cette semaine</div>
            <div class="text-2xl font-black mt-1" style="color: var(--accent-color)">${kmWeek.toFixed(1)} km</div>
          </div>
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
            <div class="text-xs text-slate-400">Km ce mois</div>
            <div class="text-2xl font-black mt-1">${kmMonth.toFixed(1)} km</div>
          </div>
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
            <div class="text-xs text-slate-400">Km cette année</div>
            <div class="text-2xl font-black mt-1">${kmYear.toFixed(1)} km</div>
          </div>
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
            <div class="text-xs text-slate-400">D+ cumulé (${yearPrefix})</div>
            <div class="text-2xl font-black text-amber-400 mt-1">${dplusYear} m</div>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-4">
          <h3 class="font-extrabold text-base">📈 Évolution du kilométrage (6 dernières semaines)</h3>
          <div class="grid grid-cols-6 gap-3 items-end h-40 pt-4">
            ${weeklyBars.map(b => `
              <div class="flex flex-col items-center gap-1.5 h-full justify-end">
                <span class="text-xs font-bold">${b.km} km</span>
                <div class="w-full max-w-[44px] rounded-t-xl transition-all" style="height: ${Math.max(8, (b.km / maxKm) * 100)}%; background: var(--accent-color)"></div>
                <span class="text-[11px] text-slate-400">${b.label}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-extrabold text-base">🏆 Mes Temps Records</h3>
            <button onclick="openAddRecordModal('${ath.id}')" class="px-3 py-1.5 rounded-xl text-white font-bold text-xs" style="background: var(--accent-color)">+ Ajouter un record</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            ${(ath.records || []).map(rec => `
              <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <div>
                  <div class="text-xs text-slate-400">${rec.label}</div>
                  <div class="text-xl font-black" style="color: var(--accent-color)">${rec.time}</div>
                  <div class="text-[11px] text-slate-500">${rec.date}</div>
                </div>
                <button onclick="deleteRecord('${ath.id}', '${rec.id}')" class="text-xs text-rose-400">✕</button>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function adaptWeekCycleFatigue(athleteId, mondayISO) {
    const ath = state.athletes.find(a => a.id === athleteId);
    if (!ath) return;
    const weekDates = Array.from({ length: 7 }, (_, i) => addDays(mondayISO, i));
    let adapted = 0;

    ath.plans.forEach(p => {
      if (weekDates.includes(p.date) && !p.completed) {
        const c = state.catalogCourse.find(x => x.id === p.courseId);
        if (c && c.facteurVMA > 0.72) {
          p.courseId = 'c24';
          p.echauffementId = 't0';
          p.recupId = 't0';
          adapted++;
        }
        if (p.renfoId && p.renfoId !== 'r0') {
          p.renfoId = 'r11';
        }
      }
    });
    pushAthleteNotification(athleteId, {
      icon: '🌸',
      title: 'Planning adapté (Cycle / Fatigue)',
      message: `Le coach a allégé ${adapted} séance(s) de ta semaine du ${formatDateFR(mondayISO)} en mode Confort & Mobilité.`,
      dateISO: mondayISO
    });
    saveState();
    render();
    showToast(`🌸 Semaine adaptée & notification envoyée à ${ath.name}`);
  }

    if (!ath || isNaN(val) || val <= 0) return;
    ath.vma = val;
    ath.vmaHistory = ath.vmaHistory || [];
    ath.vmaHistory.push({ date: formatDateISO(new Date()), vma: val, note });
    pushAthleteNotification(athleteId, {
      icon: '⚡',
      title: `VMA mise à jour : ${val} km/h`,
      message: `Le coach a actualisé ta VMA (${note}). Tes allures cibles ont été recalculées.`
    });
    saveState();
    closeModal();
    render();
    showToast(`⚡ VMA mise à jour à ${val} km/h`);

  function savePlannedSession(athleteId, dateISO, planId) {
    const ath = state.athletes.find(a => a.id === athleteId);
    const data = {
      courseId: document.getElementById('plan-course').value,
      echauffementId: document.getElementById('plan-t1').value,
      recupId: document.getElementById('plan-t2').value,
      renfoId: document.getElementById('plan-renfo').value
    };
    const courseObj = state.catalogCourse.find(c => c.id === data.courseId);
    const renfoObj = state.catalogRenfo.find(r => r.id === data.renfoId);
    const renfoTxt = (renfoObj && renfoObj.id !== 'r0') ? ` + ${renfoObj.nom}` : '';

    if (planId) {
      const idx = ath.plans.findIndex(p => p.id === planId);
      if (idx >= 0) Object.assign(ath.plans[idx], data);
      pushAthleteNotification(athleteId, {
        icon: '✏️',
        title: `Séance modifiée le ${formatDateFR(dateISO)}`,
        message: `${courseObj ? courseObj.nom : 'Séance'}${renfoTxt}`,
        dateISO
      });
    } else {
      ath.plans.push({
        id: 'p_' + Date.now(),
        date: dateISO,
        ...data,
        completed: false,
        reaction: '',
        rpe: null,
        athleteNote: '',
        coachComment: '',
        coachLiked: false,
        gpxData: null
      });
      pushAthleteNotification(athleteId, {
        icon: '📅',
        title: `Nouvelle séance ajoutée le ${formatDateFR(dateISO)}`,
        message: `${courseObj ? courseObj.nom : 'Séance'}${renfoTxt}`,
        dateISO
      });
    }
    saveState();
    closeModal();
    render();
    showToast(`🔔 Planning mis à jour & notification envoyée à ${ath.name}`);
  }

  function deletePlannedSession(athleteId, planId) {
    const ath = state.athletes.find(a => a.id === athleteId);
    const p = ath.plans.find(x => x.id === planId);
    const courseObj = p ? state.catalogCourse.find(c => c.id === p.courseId) : null;
    ath.plans = ath.plans.filter(x => x.id !== planId);
    if (p) {
      pushAthleteNotification(athleteId, {
        icon: '🗑️',
        title: `Séance retirée du ${formatDateFR(p.date)}`,
        message: `${courseObj ? courseObj.nom : 'Séance'} a été supprimée de ton planning.`,
        dateISO: p.date
      });
    }
    saveState();
    render();
    showToast(`🗑️ Séance supprimée & notification envoyée`);
  }

  function saveAthleteRpe(athleteId, planId) {
    const ath = state.athletes.find(a => a.id === athleteId);
    const p = ath.plans.find(x => x.id === planId);
    const courseObj = state.catalogCourse.find(c => c.id === p.courseId);

    p.reaction = document.getElementById('rpe-emoji').value || '💪';
    p.rpe = parseInt(document.getElementById('rpe-range').value, 10);
    p.athleteNote = document.getElementById('rpe-note').value;

    pushCoachNotification({
      athleteId: ath.id,
      athleteName: ath.name,
      icon: p.reaction,
      title: `${ath.name} a validé sa séance (${p.reaction} RPE ${p.rpe}/10)`,
      message: `${courseObj ? courseObj.nom : 'Séance'}${p.athleteNote ? ' : « ' + p.athleteNote + ' »' : ''}`,
      dateISO: p.date
    });

    saveState();
    closeModal();

  function handleGpxUpload(event, athleteId, planId) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const stats = parseGPXText(e.target.result);
        const ath = state.athletes.find(a => a.id === athleteId);
        const p = ath.plans.find(x => x.id === planId);
        const courseObj = state.catalogCourse.find(c => c.id === p.courseId);
        p.gpxData = stats;
        p.completed = true;
        if (!p.rpe) p.rpe = 6;
        if (!p.reaction) p.reaction = '⌚';

        pushCoachNotification({
          athleteId: ath.id,
          athleteName: ath.name,
          icon: '⌚',
          title: `Trace GPX importée par ${ath.name}`,
          message: `${courseObj ? courseObj.nom : 'Séance'} : ${stats.distanceKm} km • ${stats.dplusM} m D+`,
          dateISO: p.date
        });

        saveState();
        render();
        showToast(`⌚ Trace GPX importée : ${stats.distanceKm} km & ${stats.dplusM} m D+`);
      } catch (err) {
        showToast('❌ ' + err.message);
      }
    };
    reader.readAsText(file);
  }

    ensureDataIntegrity(state);
    const val = document.getElementById('coach-name-input')?.value.trim();
    if (!val) return showToast('❌ Entrez un nom de coach');
    state.coachProfile.name = val;
    saveState();
    render();
    showToast('✅ Nom du Coach mis à jour');
  }

  function setCoachAccentColor(hex) {
    ensureDataIntegrity(state);
    state.coachProfile.accentColor = hex;
    saveState();
    render();
    showToast('🎨 Couleur principale mise à jour');
  }

  function setCoachThemeMode(mode) {
    ensureDataIntegrity(state);
    state.coachProfile.themeMode = mode;
    saveState();
    render();
  }

  function toggleCoachTheme() {
    ensureDataIntegrity(state);
    state.coachProfile.themeMode = state.coachProfile.themeMode === 'light' ? 'dark' : 'light';
    saveState();
    render();
  }

  function updateCoachPin() {
    const val = document.getElementById('new-pin-input')?.value.trim();
    if (val && val.length >= 4) {
      state.coachPin = val;
      saveState();
      showToast('🔐 Code PIN mis à jour');
    } else {
      showToast('❌ Minimum 4 chiffres');
    }
  }

  function updateTargetRaceDate(athleteId, newDate) {
    const ath = state.athletes.find(a => a.id === athleteId);
    if (ath && newDate) {
      ath.targetRace.date = newDate;
      saveState();
      render();
    }
  }

  function saveFirebaseConfig() {
    const databaseURL = document.getElementById('fb-db-url').value.trim();
    const apiKey = document.getElementById('fb-api-key').value.trim();
    const projectId = document.getElementById('fb-project-id').value.trim();
    const authDomain = document.getElementById('fb-auth-domain').value.trim();
    if (!databaseURL || !apiKey) return showToast('❌ Renseignez Database URL et API Key');
    state.firebaseConfig = { databaseURL, apiKey, projectId, authDomain };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    initFirebase();
    saveState();
    render();
  }

  /**************************************************************************
   * 10. BOUCLE DE RENDU PRINCIPALE & DÉMARRAGE
   **************************************************************************/
  function render() {
    const root = document.getElementById('app');
    if (ui.view === 'landing') root.innerHTML = renderLanding();
    else if (ui.view === 'coach') root.innerHTML = renderCoachView();
    else if (ui.view === 'athlete') root.innerHTML = renderAthleteView();
  }

  window.addEventListener('DOMContentLoaded', async () => {
    checkMagicLink();
    initFirebase();
    await pullFromFirebase();
    render();
    startAutoUpdateWatcher();
    setTimeout(() => checkForRemoteNetlifyUpdate(false), 3000);
    if (window.__TRAILRUN_OTA_META__) {
      showToast(`🚀 Application mise à jour en ${window.__TRAILRUN_OTA_META__.version} !`);
      if (ui.view === 'coach') {
        openNotificationsModal('coach', null, true);
      }
    }
  });
  </script>
</body>
</html>
